const BUDGET = 260000;

const months = [...new Set(RAW.map(r=>r.month).filter(Boolean))].sort();
const projects = [...new Set(RAW.map(r=>r.project).filter(Boolean))].sort();
const requesters = [...new Set(RAW.map(r=>r.requester).filter(Boolean))].sort();
const statuses = [...new Set(RAW.map(r=>r.status).filter(Boolean))].sort();

let selMonths = new Set();
function renderMonthChips() {
  const box = document.getElementById('monthChips');
  let html = `<span class="month-chip ${selMonths.size===0?'active':''}" data-m="__all">全部月份</span>`;
  months.forEach(m => { html += `<span class="month-chip ${selMonths.has(m)?'active':''}" data-m="${m}">${m}</span>`; });
  box.innerHTML = html;
}
renderMonthChips();
document.getElementById('monthChips').addEventListener('click', e => {
  const chip = e.target.closest('.month-chip');
  if (!chip) return;
  const m = chip.dataset.m;
  if (m === '__all') { selMonths.clear(); }
  else { selMonths.has(m) ? selMonths.delete(m) : selMonths.add(m); }
  renderMonthChips();
  render();
});
projects.forEach(p => document.getElementById('projectFilter').innerHTML += `<option value="${p}">${p}</option>`);
requesters.forEach(r => document.getElementById('requesterFilter').innerHTML += `<option value="${r}">${r}</option>`);
statuses.forEach(s => document.getElementById('statusFilter').innerHTML += `<option value="${s}">${s}</option>`);

function getFiltered() {
  const pf = document.getElementById('projectFilter').value;
  const rf = document.getElementById('requesterFilter').value;
  const sf = document.getElementById('statusFilter').value;
  const q = document.getElementById('searchBox').value.toLowerCase();
  return RAW.filter(r => {
    if (selMonths.size > 0 && !selMonths.has(r.month)) return false;
    if (pf !== 'all' && r.project !== pf) return false;
    if (rf !== 'all' && r.requester !== rf) return false;
    if (sf !== 'all' && r.status !== sf) return false;
    if (q && !r.taskName.toLowerCase().includes(q)) return false;
    return true;
  });
}

function fmt(n) { return n.toLocaleString('zh-CN', {minimumFractionDigits:0, maximumFractionDigits:2}); }
function activeMonths() { return selMonths.size > 0 ? months.filter(m=>selMonths.has(m)) : months; }

function renderCards(filtered) {
  const total = filtered.reduce((s,r)=>s+r.amount, 0);
  const settled = filtered.filter(r=>r.settled==='是').reduce((s,r)=>s+r.amount, 0);
  const pending = total - settled;
  const budget = BUDGET * activeMonths().length;
  const rate = budget > 0 ? (total/budget*100) : 0;
  document.getElementById('summaryCards').innerHTML = `
    <div class="card blue"><div class="label">已使用金额</div><div class="value">&yen;${fmt(total)}</div><div class="sub">共 ${filtered.length} 条任务</div></div>
    <div class="card ${rate>90?'red':rate>70?'orange':'green'}"><div class="label">预算使用率</div><div class="value">${rate.toFixed(1)}%</div><div class="sub">预算总额 &yen;${fmt(budget)}</div></div>
    <div class="card green"><div class="label">已结算</div><div class="value">&yen;${fmt(settled)}</div><div class="sub">占比 ${total>0?(settled/total*100).toFixed(1):0}%</div></div>
    <div class="card orange"><div class="label">待结算</div><div class="value">&yen;${fmt(pending)}</div><div class="sub">占比 ${total>0?(pending/total*100).toFixed(1):0}%</div></div>
    <div class="card purple"><div class="label">剩余预算</div><div class="value">&yen;${fmt(Math.max(0, budget-total))}</div><div class="sub">${budget-total<0?'⚠️ 已超支':'可用余额'}</div></div>
  `;
}

function renderProgress(filtered) {
  const container = document.getElementById('progressBars');
  const showMonths = activeMonths();
  let html = '';
  showMonths.forEach(m => {
    const mTotal = filtered.filter(r=>r.month===m).reduce((s,r)=>s+r.amount, 0);
    const pct = Math.min(mTotal/BUDGET*100, 100);
    const cls = pct > 90 ? 'danger' : pct > 70 ? 'warn' : 'safe';
    html += `<div class="month-progress">
      <div class="month-label"><span class="name">${m}</span><span class="amount">&yen;${fmt(mTotal)} / &yen;${fmt(BUDGET)} (${(mTotal/BUDGET*100).toFixed(1)}%)</span></div>
      <div class="progress-bar"><div class="progress-fill ${cls}" style="width:${pct}%">${pct>15?(mTotal/BUDGET*100).toFixed(0)+'%':''}</div></div>
    </div>`;
  });
  container.innerHTML = html;
}

let pieChart = null, barChart = null;
function renderCharts(filtered) {
  const projMap = {};
  filtered.forEach(r => { projMap[r.project] = (projMap[r.project]||0) + r.amount; });
  const projLabels = Object.keys(projMap).sort((a,b)=>projMap[b]-projMap[a]);
  const projValues = projLabels.map(k=>projMap[k]);
  const colors = ['#1890ff','#52c41a','#fa8c16','#722ed1','#f5222d','#13c2c2','#eb2f96','#faad14','#2f54eb','#a0d911'];

  if(pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: { labels: projLabels, datasets: [{ data: projValues, backgroundColor: colors.slice(0, projLabels.length) }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: {size:11} } } } }
  });

  const showMonths = activeMonths();
  const actualByMonth = showMonths.map(m => filtered.filter(r=>r.month===m).reduce((s,r)=>s+r.amount, 0));

  if(barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: showMonths,
      datasets: [
        { label: '实际使用', data: actualByMonth, backgroundColor: '#1890ff', borderRadius: 4 },
        { label: '月度预算', data: showMonths.map(()=>BUDGET), type: 'line', borderColor: '#f5222d', borderDash: [5,5], pointRadius: 4, fill: false }
      ]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { callback: v=>'¥'+(v/10000).toFixed(0)+'万' } } }, plugins: { legend: { position: 'bottom' } } }
  });
}

function renderTable(filtered) {
  const sorted = [...filtered].sort((a,b) => b.date.localeCompare(a.date) || b.amount - a.amount);
  let html = '';
  sorted.forEach(r => {
    const pTag = r.priority === 'P0' ? 'tag-p0' : 'tag-p1';
    let sTag = 'tag-pending', sText = r.status;
    if (r.settled === '是') { sTag = 'tag-settled'; }
    else if (r.status === '进行中') { sTag = 'tag-progress'; }
    else if (r.status === '已交付') { sTag = 'tag-delivered'; }
    html += `<tr>
      <td>${r.date}</td>
      <td>${r.project}</td>
      <td title="${r.taskName}">${r.taskName.length>35 ? r.taskName.slice(0,35)+'...' : r.taskName}</td>
      <td>${r.requester}</td>
      <td>${r.volume||'-'}</td>
      <td>${r.unit||'-'}</td>
      <td class="amount-cell">&yen;${fmt(r.amount)}</td>
      <td><span class="tag ${pTag}">${r.priority}</span> <span class="tag ${sTag}">${sText}</span></td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML = html;
  const totalAmt = filtered.reduce((s,r)=>s+r.amount,0);
  document.getElementById('tableFoot').innerHTML = `<tr class="summary-row"><td colspan="6">合计</td><td class="amount-cell">&yen;${fmt(totalAmt)}</td><td>${filtered.length}条</td></tr>`;
  document.getElementById('tableCount').textContent = `(共${filtered.length}条)`;
}

function render() {
  const filtered = getFiltered();
  renderCards(filtered);
  renderProgress(filtered);
  renderCharts(filtered);
  renderTable(filtered);
}

['projectFilter','requesterFilter','statusFilter'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('searchBox').addEventListener('input', render);
render();
</script>
